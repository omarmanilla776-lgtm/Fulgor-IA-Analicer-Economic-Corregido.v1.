name: CI

on:
  push:
    branches: [main, 'fix/audit-security-epistemic-integrity']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Production server smoke test
        shell: bash
        run: |
          set -euo pipefail
          FULGOR_API_KEY=ci-smoke-test-012345678901234567890123456789 NODE_ENV=production node dist/server.cjs > /tmp/fulgor-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/v1/health > /tmp/fulgor-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          node -e "const h=require('/tmp/fulgor-health.json'); if(h.status!=='ok') process.exit(1)"

          unauth_status=$(curl --silent --output /tmp/fulgor-unauth.json --write-out '%{http_code}' http://127.0.0.1:3000/api/v1/indicators)
          test "$unauth_status" = "401"

          auth_status=$(curl --silent --output /tmp/fulgor-indicators.json --write-out '%{http_code}' -H 'Authorization: Bearer ci-smoke-test-012345678901234567890123456789' http://127.0.0.1:3000/api/v1/indicators)
          test "$auth_status" = "200"
          node -e "const d=require('/tmp/fulgor-indicators.json'); if(d.dataStatus!=='DEMO_DATA_NOT_VERIFIED') process.exit(1)"

          legacy_unauth_status=$(curl --silent --output /tmp/fulgor-legacy-unauth.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"prompt":"test"}' http://127.0.0.1:3000/api/copilot/chat)
          test "$legacy_unauth_status" = "401"

          legacy_auth_status=$(curl --silent --output /tmp/fulgor-legacy-auth.json --write-out '%{http_code}' -H 'Authorization: Bearer ci-smoke-test-012345678901234567890123456789' -H 'Content-Type: application/json' -d '{"prompt":""}' http://127.0.0.1:3000/api/copilot/chat)
          test "$legacy_auth_status" = "400"

          bad_simulation_status=$(curl --silent --output /tmp/fulgor-bad-simulation.json --write-out '%{http_code}' -H 'Authorization: Bearer ci-smoke-test-012345678901234567890123456789' -H 'Content-Type: application/json' -d '{"aiAdoptionDelta":1000}' http://127.0.0.1:3000/api/digital-twin/simulate)
          test "$bad_simulation_status" = "400"

          bad_correlation_status=$(curl --silent --output /tmp/fulgor-bad-correlation.json --write-out '%{http_code}' -H 'Authorization: Bearer ci-smoke-test-012345678901234567890123456789' -H 'Content-Type: application/json' -d '{"x":[1,2,3],"y":[1,"bad",3]}' http://127.0.0.1:3000/api/v1/correlation)
          test "$bad_correlation_status" = "400"

          legacy_health_key_status=$(curl --silent --output /tmp/fulgor-short-key.json --write-out '%{http_code}' -H 'Authorization: Bearer ci-smoke-test' -H 'Content-Type: application/json' -d '{"prompt":"test"}' http://127.0.0.1:3000/api/copilot/chat)
          test "$legacy_health_key_status" = "401"
